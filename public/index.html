<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应猴传说：高塘爆破战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0b0f1a; color: #fff; overflow: hidden; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 20; }
  .screen.on { display: flex; }
  h1 { font-size: 34px; letter-spacing: 3px; text-shadow: 0 0 20px #4da6ff88; }
  .sub { color: #8fa3c8; }
  input { padding: 11px 16px; font-size: 16px; border-radius: 10px; border: 2px solid #3a4a6b; background: #131c30; color: #fff; outline: none; text-align: center; }
  button { padding: 11px 30px; font-size: 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; color: #fff; background: linear-gradient(135deg, #4da6ff, #c77dff); }
  button:hover { filter: brightness(1.2); }
  button.ghost { background: #1c2740; border: 1px solid #3a4a6b; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #screen-name { background: radial-gradient(ellipse at center, #16203a 0%, #0b0f1a 70%); }
  .row { display: flex; gap: 10px; align-items: center; }

  /* 大厅 */
  #screen-lobby { background: #0d1322; justify-content: flex-start; padding: 24px; overflow-y: auto; }
  #room-code { font-size: 26px; color: #ffd54d; letter-spacing: 6px; }
  #lobby-main { display: flex; gap: 18px; width: 100%; max-width: 1000px; }
  .team-col { flex: 1; background: #131c30; border-radius: 12px; padding: 14px; min-height: 220px; }
  .team-col h3 { margin-bottom: 8px; }
  .team-monkey h3 { color: #ff5a5a; } .team-timor h3 { color: #4da6ff; }
  .p-row { padding: 6px 10px; background: #0f1730; border-radius: 8px; margin-bottom: 6px; font-size: 14px; display: flex; justify-content: space-between; }
  #hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 1000px; }
  .hero-card { background: #131c30; border: 2px solid #2a3a5b; border-radius: 12px; padding: 10px; cursor: pointer; text-align: center; transition: .15s; }
  .hero-card:hover { border-color: #5a7ab5; }
  .hero-card.sel { border-color: #ffd54d; box-shadow: 0 0 14px #ffd54d55; }
  .hero-card .hc-name { font-weight: bold; margin: 4px 0 2px; }
  .hero-card .hc-info { font-size: 11px; color: #8fa3c8; line-height: 1.5; }
  .hero-dot { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto; }
  #lobby-chat { width: 100%; max-width: 1000px; }
  #lobby-chat-log { height: 80px; overflow-y: auto; background: #0f1730; border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-bottom: 6px; }

  /* 游戏 HUD */
  #screen-game { background: none; pointer-events: none; z-index: 10; justify-content: flex-end; }
  #hud-bottom { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 18px 22px; }
  #hp-box { background: rgba(10,15,28,.65); border-radius: 10px; padding: 8px 16px; }
  #hp-bar { width: 180px; height: 14px; background: #333; border-radius: 7px; overflow: hidden; margin-top: 4px; }
  #hp-fill { height: 100%; background: linear-gradient(90deg,#5ad66f,#a3d94d); transition: width .15s; }
  #skill-box { background: rgba(10,15,28,.65); border-radius: 10px; padding: 8px 16px; text-align: center; }
  #skill-cd { font-size: 22px; font-weight: bold; color: #ffd54d; }
  #skill-name { font-size: 12px; color: #8fa3c8; }
  #top-bar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; background: rgba(10,15,28,.65); padding: 8px 22px; border-radius: 12px; }
  .win-pips { display: flex; gap: 4px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: #2a3a5b; }
  #round-timer { font-size: 24px; font-weight: bold; min-width: 60px; text-align: center; }
  #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 20px; color: #fff; text-shadow: 0 0 4px #000; }
  #hitmark { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(45deg); font-size: 26px; color: #ff5a5a; opacity: 0; font-weight: bold; }
  #killfeed { position: fixed; top: 70px; right: 16px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .kf { background: rgba(10,15,28,.7); padding: 4px 12px; border-radius: 8px; font-size: 13px; }
  #banner { position: fixed; top: 22%; width: 100%; text-align: center; font-size: 34px; font-weight: bold; text-shadow: 0 2px 12px #000; opacity: 0; transition: opacity .3s; }
  #interact-box { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); text-align: center; display: none; }
  #interact-bar { width: 240px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  #interact-fill { height: 100%; background: #ffd54d; width: 0%; }
  #bomb-banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: rgba(180,40,40,.8); padding: 5px 18px; border-radius: 8px; font-size: 14px; display: none; }
  #scoreboard { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(10,15,28,.92); border-radius: 14px; padding: 20px 30px; display: none; min-width: 480px; }
  #scoreboard table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #scoreboard td, #scoreboard th { padding: 5px 10px; text-align: left; }
  #spectate-label { position: fixed; top: 15%; width: 100%; text-align: center; font-size: 18px; color: #ffb84d; display: none; text-shadow: 0 1px 6px #000; }
  #game-chat { position: fixed; left: 14px; bottom: 90px; width: 320px; pointer-events: none; }
  #game-chat-log { display: flex; flex-direction: column; gap: 3px; max-height: 140px; overflow-y: auto; margin-bottom: 5px; }
  .cm { font-size: 13px; background: rgba(10,15,28,.6); padding: 3px 9px; border-radius: 7px; width: fit-content; }
  #game-chat-input { width: 100%; font-size: 13px; padding: 7px 10px; display: none; pointer-events: auto; }
  #tips { position: fixed; bottom: 2px; width: 100%; text-align: center; font-size: 11px; color: #5a6a8b; }

  /* 结算 */
  #screen-end { background: rgba(8,11,20,.94); }
  #end-board { background: #131c30; border-radius: 14px; padding: 18px 28px; min-width: 440px; }
  #end-board td, #end-board th { padding: 6px 14px; font-size: 15px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>

<div id="screen-name" class="screen on">
  <h1>🐵 应猴传说：高塘爆破战</h1>
  <p class="sub">机械猴子播放搏击操 vs 帝汶家族拖进度条 · 3v3 回合制爆破</p>
  <input id="name-input" maxlength="12" placeholder="你的昵称" autofocus>
  <div class="row">
    <button id="btn-create">创建房间</button>
    <input id="code-input" maxlength="4" placeholder="房间码" style="width:110px">
    <button id="btn-join" class="ghost">加入</button>
  </div>
  <p id="name-err" class="sub" style="color:#ff7a7a"></p>
</div>

<div id="screen-lobby" class="screen">
  <div>房间码 <span id="room-code">----</span> （发给同学，输入即可加入）</div>
  <div id="lobby-main">
    <div class="team-col team-monkey">
      <h3>🐵 机械猴子 <button id="btn-side-monkey" class="ghost" style="float:right;padding:3px 12px;font-size:12px">加入</button></h3>
      <div id="team-monkey-list"></div>
    </div>
    <div class="team-col team-timor">
      <h3>🦟 帝汶家族 <button id="btn-side-timor" class="ghost" style="float:right;padding:3px 12px;font-size:12px">加入</button></h3>
      <div id="team-timor-list"></div>
    </div>
  </div>
  <div id="hero-grid"></div>
  <div class="row">
    <button id="btn-start" style="font-size:18px">开始比赛</button>
    <span class="sub" id="lobby-hint">选择阵营和英雄；人数不足将由 AI 补齐 3v3</span>
  </div>
  <div id="lobby-chat">
    <div id="lobby-chat-log"></div>
    <input id="lobby-chat-input" placeholder="回车发送消息…" maxlength="100" style="width:100%">
  </div>
</div>

<div id="screen-game" class="screen">
  <div id="top-bar">
    <div class="win-pips" id="pips-monkey"></div>
    <span id="round-timer">--</span>
    <div class="win-pips" id="pips-timor"></div>
  </div>
  <div id="bomb-banner">💣 搏击操已播放！<span id="bomb-timer">45</span>s</div>
  <div id="crosshair">＋</div>
  <div id="hitmark">✕</div>
  <div id="killfeed"></div>
  <div id="banner"></div>
  <div id="spectate-label">👁 观战中：<span id="spectate-name"></span>（点击切换队友）</div>
  <div id="interact-box">
    <span id="interact-label">按住 E</span>
    <div id="interact-bar"><div id="interact-fill"></div></div>
  </div>
  <div id="scoreboard">
    <h3 style="margin-bottom:8px">第 <span id="sb-round">1</span> 回合</h3>
    <table><thead><tr><th>玩家</th><th>英雄</th><th>阵营</th><th>击杀</th><th>死亡</th></tr></thead><tbody id="sb-body"></tbody></table>
  </div>
  <div id="game-chat">
    <div id="game-chat-log"></div>
    <input id="game-chat-input" placeholder="回车发送 · Esc 关闭" maxlength="100">
  </div>
  <div id="hud-bottom">
    <div id="hp-box">❤ <span id="hp-num">100</span><div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div></div>
    <div id="skill-box"><div id="skill-cd">Q</div><div id="skill-name">技能</div></div>
  </div>
  <div id="tips">第一人称 · WASD 移动 · 鼠标射击 · Q 技能 · E 下包/拆包 · 空格跳 · Tab 计分板 · 回车聊天</div>
</div>

<div id="screen-end" class="screen">
  <h1 id="end-title">🏆</h1>
  <div id="end-board"><table><thead><tr><th>#</th><th>玩家</th><th>英雄</th><th>击杀</th><th>死亡</th></tr></thead><tbody id="end-body"></tbody></table></div>
  <p class="sub">即将返回大厅，可再来一局…</p>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
